name: Error OS ROM Build

on:
  workflow_dispatch:
    inputs:
      input_url:
        description: 'URL'
        required: true
      toolbox_mode:
        description: 'Toolbox trong Settings: root = có root + Error OS Toolbox; kaorios = không root + Kaorios Toolbox'
        type: choice
        options:
          - root
          - kaorios
        default: root

jobs:
  Initialize:
    runs-on: ubuntu-latest
    container: archlinux:latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
      TELEGRAM_GROUP_ID: ${{ secrets.TELEGRAM_GROUP_ID }}
      BUILDER_NAME: "iabi"
      BUILDER_ID: ${{ secrets.TELEGRAM_OWNER_ID }}

    steps:
      - name: Free runner space + pacman base
        run: |
          pacman -Syu --noconfirm --needed git tar sudo ca-certificates
          rm -rf /usr/share/dotnet /opt/ghc /opt/microsoft /usr/local/.ghcup \
                 /usr/lib/mono /opt/az /usr/share/swift /usr/local/share/boost || true
          pacman -Scc --noconfirm || true
          df -h /

      - name: Free runner space
        run: |
          rm -rf /opt/ghc /usr/share/swift /usr/local/share/boost /opt/microsoft /usr/local/.ghcup /usr/lib/mono || true
          df -h /

      - name: Checkout repository
        uses: actions/checkout@main

      - name: Show disk space
        run: |
          df -h
          df -h "$GITHUB_WORKSPACE"
          lsblk -o NAME,SIZE,TYPE,MOUNTPOINT

      - name: Set up timezone
        run: ln -sf /usr/share/zoneinfo/Asia/Ho_Chi_Minh /etc/localtime

      - name: Install JDK
        run: pacman -S --noconfirm --needed jdk-openjdk

      - name: Install Stuff
        run: bash setup.sh

      - name: Giving permission
        run: chmod 777 -R *

      - name: Build prop-fix helper
        run: |
          set -e
          SRC="bin/package/ErrorOSPropFix/erroros_propfix.c"
          OUT="bin/package/ErrorOSPropFix/erroros_propfix"
          if [ ! -f "$SRC" ]; then
            echo "Không có $SRC - bỏ qua"
            exit 0
          fi

          # Không dùng NDK: binary chỉ cần libc chuẩn, cross-gcc của Arch Linux
          # (aarch64-linux-gnu-gcc) là đủ và tĩnh hoàn toàn, tự chứa.
          pacman -S --noconfirm --needed gcc-aarch64-linux-gnu aarch64-linux-gnu-glibc
          CC=aarch64-linux-gnu-gcc
          "$CC" --version | head -1
          echo "sysroot: $($CC -print-sysroot)"

          gcc -O1 -Wall -DERROROS_SELFTEST -o /tmp/propfix_selftest "$SRC"
          /tmp/propfix_selftest --selftest

          "$CC" -Os -Wall -fno-stack-protector -static -no-pie -s -o "$OUT" "$SRC"
          file "$OUT"
          ls -la "$OUT"

      - name: Apply toolbox mode
        run: |
          MODE="${{ inputs.toolbox_mode }}"
          if [ -z "$MODE" ]; then MODE=root; fi
          case "$MODE" in
            root|kaorios) ;;
            *) echo "toolbox_mode không hợp lệ: $MODE"; exit 1 ;;
          esac
          if grep -q '^toolbox_mode=' config.env; then
            sed -i "s/^toolbox_mode=.*/toolbox_mode=$MODE/" config.env
          else
            echo "toolbox_mode=$MODE" >> config.env
          fi
          echo "--- toolbox_mode trong config.env ---"
          grep -n '^toolbox_mode=' config.env

      - name: Build ROM...
        timeout-minutes: 180
        env:
          INPUT_URL: ${{ inputs.input_url }}
        run: bash build.sh "$INPUT_URL" "${{ github.repository }}" "xiaomi" "${{ env.BUILDER_NAME }}" "${{ env.BUILDER_ID }}"

      - name: Pack ROM...
        timeout-minutes: 60
        run: bash packROM.sh

      - name: Upload ROM...
        run: bash uploadROM.sh

      - name: Upload ROM to Google Drive
        id: drive
        if: success()
        continue-on-error: true
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
          GDRIVE_DIR: ${{ secrets.GDRIVE_DIR }}
        run: |
          if [ -z "$RCLONE_CONF" ]; then
            echo "Chưa cấu hình RCLONE_CONF -> bỏ qua Google Drive"
            exit 1
          fi

          ROM_ZIP_PATH="out/$(cat bin/ddevice/output_zip.txt)"
          if [ ! -f "$ROM_ZIP_PATH" ]; then
            echo "Không thấy file ROM: $ROM_ZIP_PATH"
            exit 1
          fi

          DEST="${GDRIVE_DIR:-gdrive:Error OS}"
          mkdir -p "$HOME/.config/rclone"
          printf '%s\n' "$RCLONE_CONF" > "$HOME/.config/rclone/rclone.conf"

          echo "Upload lên Google Drive: $DEST"
          rclone copy "$ROM_ZIP_PATH" "$DEST" --drive-chunk-size 256M --retries 3 --low-level-retries 10 --stats 30s --stats-one-line

          LINK=$(rclone link "$DEST/$(basename "$ROM_ZIP_PATH")" 2>/dev/null || true)
          if [ -z "$LINK" ]; then
            echo "Upload xong nhưng không tạo được link chia sẻ"
            exit 1
          fi

          echo "Download link (Drive): $LINK"
          echo "DOWNLOAD_LINK=$LINK" >> "$GITHUB_ENV"

      - name: Upload ROM to Gofile.io
        if: success() && steps.drive.outcome != 'success'
        continue-on-error: true
        env:
          GOFILE_TOKEN: ${{ secrets.GOFILE_TOKEN }}
        run: |
          set +e
          ROM_ZIP_PATH="out/$(cat bin/ddevice/output_zip.txt)"
          if [ ! -f "$ROM_ZIP_PATH" ]; then
            echo "Không thấy file ROM: $ROM_ZIP_PATH"
            exit 1
          fi

          df -h /
          free -h

          SERVER=$(curl -fsS --max-time 60 https://api.gofile.io/servers | jq -r '.data.servers[0].name')
          if [ -z "$SERVER" ] || [ "$SERVER" = "null" ]; then
            echo "Không lấy được Gofile server"
            exit 1
          fi
          echo "Gofile server: $SERVER"

          AUTH=()
          if [ -n "$GOFILE_TOKEN" ]; then
            AUTH=(-F "token=${GOFILE_TOKEN}")
          fi

          LINK=""
          for i in 1 2 3; do
            RES=$(curl -sS --max-time 3600 "${AUTH[@]}" \
                  -F "file=@${ROM_ZIP_PATH}" "https://${SERVER}.gofile.io/contents/uploadfile") || RES=""
            echo "Lần $i: status=$(echo "$RES" | jq -r '.status' 2>/dev/null)"
            LINK=$(echo "$RES" | jq -r '.data.downloadPage // empty' 2>/dev/null)
            if [ -n "$LINK" ]; then
              break
            fi
            sleep 10
          done

          if [ -z "$LINK" ]; then
            echo "Upload Gofile thất bại"
            exit 1
          fi

          echo "Upload thành công! Link tải: $LINK"
          echo "DOWNLOAD_LINK=$LINK" >> "$GITHUB_ENV"

      - name: Success Notification
        if: success()
        continue-on-error: true
        run: |
          pacman -S --noconfirm --needed python-requests
          python notify.py success "${{ github.repository }}" "${{ inputs.input_url }}" "xiaomi" "${{ env.BUILDER_NAME }}" "${{ env.BUILDER_ID }}"

      - name: Failure Notification
        if: failure()
        continue-on-error: true
        run: |
          pacman -S --noconfirm --needed python-requests
          python notify.py fail "${{ github.repository }}" "${{ inputs.input_url }}" "xiaomi" "${{ env.BUILDER_NAME }}" "${{ env.BUILDER_ID }}"

      - name: Cleanup
        if: always()
        run: rm -rf out build
